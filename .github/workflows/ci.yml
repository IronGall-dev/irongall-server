# The gate AGENTS.md lists before every push, run on every push and pull
# request so each commit's result is on the public record, and once a day,
# when govulncheck meets advisories published since and the client's main
# has moved. Actions are pinned by commit, each with its release beside it.
#
# go.mod replaces the client module with ../irongall-client, so every job
# checks this repo out beside irongall-client's main.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run; every other run is its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: irongall-server

jobs:
  test:
    # Two OpenSSH releases for test/interop.sh's script: 9.6p1 and 10.2p1.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: irongall-server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronGall-dev/irongall-client
          path: irongall-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            irongall-server/go.sum
            irongall-client/go.sum
      - name: tools
        run: |
          go version; ssh -V; jq --version; curl --version | head -1; bash --version | head -1
          echo "irongall-client at $(git -C ../irongall-client rev-parse HEAD)"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::not gofmt'd:"; echo "$out"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        # On the in-memory store: the AWS tests and the cost measurement skip,
        # and a skip of any other test fails the job.
        run: |
          set +e
          go test -count=1 -json ./... | tee "$RUNNER_TEMP/test.json" | jq -rj --unbuffered 'select(.Action == "output") | .Output'
          status=${PIPESTATUS[0]}
          set -e
          jq -rs '[.[] | select(.Test != null)] | group_by([.Package, .Test])[] | select(any(.Action == "skip"))
            | "\(.[0].Package) \(.[0].Test): " + ([.[] | select(.Action == "output") | .Output
              | select(test("^ +[^ ]+\\.go:[0-9]+: ")) | sub("^ +"; "") | rtrimstr("\n")] | join(" "))' \
            "$RUNNER_TEMP/test.json" > "$RUNNER_TEMP/skips"
          echo "Skipped:"; cat "$RUNNER_TEMP/skips"
          if grep -v -F -e 'needs IRONGALL_TEST_BOXES_TABLE, IRONGALL_TEST_MSGS_TABLE' -e 'needs the AWS tables' \
            -e 'set IRONGALL_COST=1 to measure' "$RUNNER_TEMP/skips"; then
            echo "::error::the tests above skipped, and this runner has every tool they need"
            exit 1
          fi
          exit "$status"
      - name: interop
        run: test/interop.sh

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: irongall-server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronGall-dev/irongall-client
          path: irongall-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            irongall-server/go.sum
            irongall-client/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: irongall-server

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: irongall-server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronGall-dev/irongall-client
          path: irongall-client
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            irongall-server/go.sum
            irongall-client/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
