# Dependency updates as pull requests (irongall-client's AGENTS.md: dependencies
# are minimums, moved to the latest by committed updates). CI runs on each one
# before it is merged, so every build, and every tag, matches a commit.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # go.mod replaces irongall-client with the checkout beside this one.
    ignore:
      - dependency-name: github.com/IronGall-dev/irongall-client
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The Dockerfile's build and runtime images, each an exact tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: docker
